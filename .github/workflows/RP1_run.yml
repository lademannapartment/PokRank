name: RP1

on:
  schedule:
    # 04:00 UTC = 05:00 CET (зима) / 06:00 CEST (лето) по польскому времени
    # Cron */2 в поле дня даёт запуски в нечётные числа: 1, 3, 5 ... 31
    - cron: '0 4 */2 * *'
  
  workflow_dispatch:
    # Кнопка для ручного запуска

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5  # Обновили до v5

      - name: Set up Python
        uses: actions/setup-python@v6 # Обновлили до v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client pandas
          playwright install chromium --with-deps

      - name: Run Python script
        run: python ranking_scraper_main.py
        env:
          # Секрет содержит JSON сервисного аккаунта как есть (без base64)
          GOOGLE_CREDS: ${{ secrets.G_KEYS_BASE64 }}
